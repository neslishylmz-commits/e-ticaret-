<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LOBA SHOP — Ürün</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d; --surface: #161616; --card: #1e1e1e;
      --accent: #e8c07d; --accent2: #c9956a;
      --text: #f0ece4; --muted: #888; --border: #2a2a2a;
      --nav-h: 72px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(13,13,13,0.85); backdrop-filter: blur(18px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 48px; z-index: 1000; }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: var(--accent); letter-spacing: 2px; text-decoration: none; flex: 1; }
    .nav-links { display: flex; align-items: center; gap: 8px; list-style: none; }
    .nav-links a { color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: 500; padding: 8px 18px; border-radius: 24px; transition: background 0.2s, color 0.2s; }
    .nav-links a:hover { background: var(--card); color: var(--accent); }
    .nav-account { position: relative; }
    .account-dropdown { display: none; position: absolute; top: calc(100% + 14px); right: 0; width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.6); overflow: hidden; }
    .account-dropdown.open { display: block; }
    .dropdown-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .dropdown-tab { flex: 1; padding: 14px; text-align: center; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--muted); transition: color 0.2s, background 0.2s; }
    .dropdown-tab.active { color: var(--accent); background: rgba(232,192,125,0.07); border-bottom: 2px solid var(--accent); }
    .dropdown-panel { padding: 24px; display: none; }
    .dropdown-panel.active { display: block; }
    .dp-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--text); margin-bottom: 18px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .form-row.full { grid-template-columns: 1fr; }
    .dp-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 0.82rem; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
    .dp-input:focus { border-color: var(--accent); }
    .dp-input::placeholder { color: var(--muted); }
    .dp-btn { width: 100%; margin-top: 14px; padding: 13px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0d0d0d; font-weight: 700; font-size: 0.9rem; border: none; border-radius: 10px; cursor: pointer; transition: opacity 0.2s; font-family: 'DM Sans', sans-serif; }
    .dp-btn:hover { opacity: 0.9; }
    .dp-link { display: block; text-align: center; margin-top: 12px; font-size: 0.78rem; color: var(--muted); }
    .dp-link a { color: var(--accent); text-decoration: none; }

    /* PAGE */
    .page { padding: calc(var(--nav-h) + 48px) 48px 80px; max-width: 1100px; margin: 0 auto; }

    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); margin-bottom: 40px; }
    .breadcrumb a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb span { color: var(--accent); }

    .product-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }

    /* Sol: Görsel */
    .product-visual { background: var(--card); border: 1px solid var(--border); border-radius: 24px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 8rem; position: relative; overflow: hidden; }
    .product-visual img { width: 100%; height: 100%; object-fit: cover; }
    .product-badge { position: absolute; top: 16px; left: 16px; background: var(--accent); color: #0d0d0d; font-size: 0.75rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; }

    /* Sağ: Bilgi */
    .product-info { display: flex; flex-direction: column; gap: 20px; }
    .product-cat { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
    .product-name { font-family: 'Playfair Display', serif; font-size: 2rem; line-height: 1.2; color: var(--text); }
    .product-price-row { display: flex; align-items: baseline; gap: 12px; }
    .product-price { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .product-old-price { font-size: 1rem; color: var(--muted); text-decoration: line-through; }
    .product-divider { border: none; border-top: 1px solid var(--border); }

    .product-desc { font-size: 0.95rem; color: var(--muted); line-height: 1.8; }

    .qty-row { display: flex; align-items: center; gap: 16px; }
    .qty-label { font-size: 0.85rem; font-weight: 600; color: var(--text); }
    .qty-control { display: flex; align-items: center; gap: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .qty-btn { background: none; border: none; color: var(--text); font-size: 1.2rem; width: 40px; height: 40px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
    .qty-btn:hover { background: var(--border); }
    .qty-val { width: 40px; text-align: center; font-weight: 600; font-size: 0.95rem; }

    .btn-row { display: flex; gap: 12px; }
    .btn-cart { flex: 1; padding: 16px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0d0d0d; font-weight: 700; font-size: 0.95rem; border: none; border-radius: 14px; cursor: pointer; transition: opacity 0.2s, transform 0.2s; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-cart:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-cart:active { transform: translateY(0); }


    .stock-info { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
    .stock-dot { width: 8px; height: 8px; border-radius: 50%; background: #7ec87e; }
    .stock-dot.out { background: #e07070; }

    /* Özellikler */
    .specs-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 16px; }
    .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .spec-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; }
    .spec-key { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .spec-val { font-size: 0.9rem; font-weight: 600; color: var(--text); }

    /* Loading / Hata */
    .loading-state { text-align: center; padding: 120px 0; color: var(--muted); font-size: 1rem; }

    footer { border-top: 1px solid var(--border); padding: 40px 48px; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 0.82rem; }
    .footer-logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--accent); font-weight: 700; }

    @media (max-width: 768px) {
      .page { padding: calc(var(--nav-h) + 24px) 20px 60px; }
      .product-layout { grid-template-columns: 1fr; gap: 32px; }
      nav { padding: 0 20px; }
      .specs-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">LOBA</a>
  <ul class="nav-links">
    <li><a href="index.html">Ana Sayfa</a></li>
    <li><a href="urunler.html">Ürünler</a></li>
    <li>
      <a href="sepet.html" style="display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-size:0.9rem;font-weight:500;padding:8px 18px;border-radius:24px;transition:background 0.2s,color 0.2s;" onmouseover="this.style.background='var(--card)';this.style.color='var(--accent)'" onmouseout="this.style.background='none';this.style.color='var(--text)'">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        Sepetim
        <span id="cartBadge" style="background:var(--accent);color:#0d0d0d;font-size:0.6rem;font-weight:700;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;">0</span>
      </a>
    </li>
    <li class="nav-account"><span id="navAccountArea"></span></li>
    <li><a href="iletisim.html">İletişim</a></li>
  </ul>
</nav>

<div class="page">
  <div id="pageContent">
    <div class="loading-state">⏳ Ürün yükleniyor...</div>
  </div>
</div>

<footer>
  <span class="footer-logo">LOBA SHOP</span>
  <span>© 2025 Loba Shop. Tüm hakları saklıdır.</span>
  <span>Güvenli alışveriş · SSL korumalı</span>
</footer>

<script>
  let adet = 1;

  async function loadProduct() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      document.getElementById('pageContent').innerHTML =
        '<div class="loading-state">❌ Ürün bulunamadı. <a href="urunler.html" style="color:var(--accent)">Geri dön</a></div>';
      return;
    }

    try {
      const res      = await fetch('/Loba/urunler.php');
      const products = await res.json();
      const p        = products.find(x => String(x.id) === String(id));

      if (!p) {
        document.getElementById('pageContent').innerHTML =
          '<div class="loading-state">❌ Ürün bulunamadı. <a href="urunler.html" style="color:var(--accent)">Geri dön</a></div>';
        return;
      }

      document.title = 'LOBA SHOP — ' + p.ad;

      const badge    = p.badge    ? `<span class="product-badge">${p.badge}</span>` : '';
      const oldPrice = p.eski_fiyat
        ? `<span class="product-old-price">₺${parseFloat(p.eski_fiyat).toLocaleString('tr-TR')}</span>` : '';
      const gorsel   = p.resim
        ? `<img src="${p.resim}" alt="${p.ad}"/>`
        : `<span>${p.emoji}</span>`;

      document.getElementById('pageContent').innerHTML = `
        <nav class="breadcrumb">
          <a href="index.html">Ana Sayfa</a> › 
          <a href="urunler.html">Ürünler</a> › 
          <span>${p.ad}</span>
        </nav>

        <div class="product-layout">

          <div class="product-visual">
            ${gorsel}
            ${badge}
          </div>

          <div class="product-info">
            <p class="product-cat">${p.kategori}</p>
            <h1 class="product-name">${p.ad}</h1>

            <div class="product-price-row">
              <span class="product-price">₺${parseFloat(p.fiyat).toLocaleString('tr-TR')}</span>
              ${oldPrice}
            </div>

            <hr class="product-divider"/>

            <p class="product-desc">
              ${p.aciklama || 'Bu ürün hakkında detaylı bilgi yakında eklenecektir.'}
            </p>

            <div class="stock-info">
              <span class="stock-dot"></span>
              <span>Stokta var · Hızlı kargo</span>
            </div>

            <div class="qty-row">
              <span class="qty-label">Adet</span>
              <div class="qty-control">
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <span class="qty-val" id="qtyVal">1</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
              </div>
            </div>

            <div class="btn-row">
              <button class="btn-cart" id="btnCart" data-id="${p.id}" data-name="${p.ad}" data-price="${p.fiyat}" data-icon="${p.emoji}" data-cat="${p.kategori}" data-resim="${p.resim || ''}" onclick="addToCart()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
                  <path d="M16 10a4 4 0 01-8 0"/>
                </svg>
                Sepete Ekle
              </button>

            </div>
          </div>
        </div>
      `;

    } catch(e) {
      document.getElementById('pageContent').innerHTML =
        '<div class="loading-state">❌ Ürün yüklenemedi. <a href="urunler.html" style="color:var(--accent)">Geri dön</a></div>';
    }
  }

  function changeQty(val) {
    adet = Math.max(1, adet + val);
    document.getElementById('qtyVal').textContent = adet;
  }

  function addToCart() {
    const btn   = document.getElementById('btnCart');
    const id    = btn.dataset.id;
    const name  = btn.dataset.name;
    const price = btn.dataset.price;
    const icon  = btn.dataset.icon;
    const cat   = btn.dataset.cat;
    const resim = btn.dataset.resim;

    let cart = [];
    try { cart = JSON.parse(localStorage.getItem('novaCart')) || []; } catch(e) { cart = []; }

    const existing = cart.find(i => i.id == id);
    if (existing) { existing.qty += adet; }
    else { cart.push({ id: String(id), name, price: parseFloat(price), icon, cat, resim: resim || '', qty: adet }); }

    localStorage.setItem('novaCart', JSON.stringify(cart));
    window.__novaAuth?.updateCartBadge();

    btn.textContent = '✓ Sepete Eklendi';
    btn.style.background = 'linear-gradient(135deg, #7ec87e, #5aaa5a)';
    setTimeout(() => {
      btn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg> Sepete Ekle';
      btn.style.background = '';
    }, 2000);
  }

  loadProduct();
</script>

<script src="auth.js"></script>
</body>
</html>
